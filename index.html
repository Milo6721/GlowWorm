<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>GLOWORM — Reef Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#01040a;--ink:#d8f6ff;--dim:#6f9bb0;--cy:#2ef2ff;--mg:#ff3fd0;--gold:#ffc94a}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Rajdhani',system-ui,sans-serif;user-select:none}
canvas{position:fixed;inset:0;display:block;cursor:crosshair}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
  background:radial-gradient(ellipse at 50% 40%,rgba(2,20,40,.35),rgba(1,4,10,.82))}
.card{width:min(440px,100%);text-align:center}
h1{font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(40px,9vw,68px);letter-spacing:.06em;line-height:1;
  background:linear-gradient(90deg,var(--cy),var(--mg),var(--gold),var(--cy));background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 7s linear infinite;
  filter:drop-shadow(0 0 18px rgba(46,242,255,.55))}
@keyframes flow{to{background-position:300% 0}}
.sub{font-family:Orbitron,sans-serif;font-size:13px;letter-spacing:.55em;color:var(--dim);margin:8px 0 28px;padding-left:.55em}
label.f{display:block;text-align:left;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:0 0 6px}
input[type=text]{width:100%;height:46px;border-radius:10px;border:1px solid rgba(46,242,255,.35);background:rgba(3,16,30,.7);
  color:var(--ink);font:600 20px 'Rajdhani',sans-serif;padding:0 14px;outline:none;user-select:text}
input[type=text]:focus{border-color:var(--cy);box-shadow:0 0 0 3px rgba(46,242,255,.18),0 0 18px rgba(46,242,255,.25)}
.row{display:flex;gap:10px;margin-top:14px}
button{cursor:pointer;height:48px;border-radius:10px;border:1px solid var(--cy);background:rgba(46,242,255,.08);color:var(--cy);
  font:700 17px 'Rajdhani',sans-serif;letter-spacing:.14em;text-transform:uppercase;transition:.15s;flex:1}
button:hover{background:rgba(46,242,255,.2);box-shadow:0 0 22px rgba(46,242,255,.4)}
button.pri{background:linear-gradient(90deg,rgba(46,242,255,.28),rgba(255,63,208,.28));border-color:#8ff;color:#fff}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#code{text-transform:uppercase;letter-spacing:.4em;text-align:center;flex:0 0 130px}
.chk{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:18px;font-size:14px;color:var(--dim);cursor:pointer}
.help{margin-top:22px;font-size:15px;color:var(--dim);line-height:1.5}
.help b{color:var(--ink);font-weight:600}
#bar{position:fixed;top:10px;right:10px;display:flex;gap:8px;align-items:center;z-index:5}
#bar .rc{font-family:Orbitron,sans-serif;font-weight:800;letter-spacing:.3em;color:var(--gold);font-size:20px;text-shadow:0 0 14px rgba(255,201,74,.6);padding-left:.3em}
#bar button{flex:none;height:34px;padding:0 12px;font-size:13px}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:rgba(3,16,30,.92);border:1px solid var(--mg);
  color:var(--ink);padding:10px 18px;border-radius:10px;font-weight:600;font-size:17px;opacity:0;pointer-events:none;transition:.25s;z-index:9;text-align:center;max-width:90vw}
#toast.on{opacity:1}
[hidden]{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu">
  <div class="card">
    <h1>GLOWORM</h1>
    <div class="sub">REEF DEFENSE</div>
    <label class="f" for="name">Twoje imię</label>
    <input id="name" type="text" maxlength="12" autocomplete="off" spellcheck="false">
    <div class="row"><button id="create" class="pri">Stwórz pokój</button></div>
    <div class="row">
      <input id="code" type="text" maxlength="4" placeholder="KOD" autocomplete="off" spellcheck="false" aria-label="Kod pokoju">
      <button id="join">Dołącz</button>
    </div>
    <label class="chk"><input type="checkbox" id="local"> Tryb testowy (bez serwera, działa między kartami tej przeglądarki)</label>
    <div class="help"><b>WASD</b> — płyń · <b>MYSZ</b> — celuj, <b>LPM</b> — strzał · <b>SPACJA</b> — puls światła<br>
    Broń Serca Rafy przed mrocznymi stworami. Razem. Do 4 graczy.</div>
  </div>
</div>

<div id="bar" hidden>
  <span class="rc" id="rc">----</span>
  <button id="copy">Kopiuj link</button>
  <button id="mute">Dźwięk</button>
  <button id="leave">Wyjdź</button>
</div>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
'use strict';
/* ============================================================
   GLOWORM — Reef Defense
   Co-op: host liczy symulację, reszta wysyła sterowanie.
   Sieć: Supabase Realtime Broadcast (kanały gloworm_room_XXXX)
   — żadnych tabel w bazie.
   ============================================================ */
const SB_URL='https://ibafumzehizoamwiixlc.supabase.co';
const SB_KEY='sb_publishable_1pJjII-6FCQGkIbqcKuTiQ_QPtZw8bv';
const PREFIX='gloworm_';
const W=1600,H=900,CX=800,CY=450,TAU=Math.PI*2,CORE_R=46,MAXP=4;
const HUES=[175,320,48,135];
const ER=[14,11,30];                       // promienie wrogów
const TIERS=[{n:1,sp:0,cd:.30},{n:2,sp:0,cd:.27,par:1},{n:3,sp:.16,cd:.25},{n:3,sp:.16,cd:.19},{n:5,sp:.13,cd:.17}];
const TH=[0,10,25,45,70];
const PULSE_CD=7,PULSE_R=190;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const cv2=$('c'),ctx=cv2.getContext('2d');

/* ---------- ekran ---------- */
let VW,VH,DPR,SC,OX,OY;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);VW=innerWidth;VH=innerHeight;
  cv2.width=VW*DPR;cv2.height=VH*DPR;cv2.style.width=VW+'px';cv2.style.height=VH+'px';
  SC=Math.min(VW/W,VH/H);OX=(VW-W*SC)/2;OY=(VH-H*SC)/2;}
addEventListener('resize',resize);resize();

/* ---------- stan globalny ---------- */
const me={id:Math.random().toString(36).slice(2,9),name:'',x:CX,y:CY+120,vx:0,vy:0,a:0,f:false,ps:0};
let isHost=false,inGame=false,joined=false,net=null,roomCode='',MODE='sb',sb=null;
let G=null;                                // symulacja hosta
const cv={pm:new Map(),em:new Map(),bm:new Map(),sm:new Map(),players:[],enemies:[],bullets:[],sparks:[],
  core:{hp:100,max:100},wave:0,ph:'break',left:0,wt:3,rn:-1,lastSnap:0};
const view=()=>(isHost&&G)?{players:G.pl,enemies:G.en,bullets:G.bu,sparks:G.sp,core:G.core,wave:G.wave,ph:G.ph,left:G.en.length+G.toSpawn,wt:G.wt}:cv;
const meP=()=>view().players.find(p=>p.id===me.id);

/* ---------- toast ---------- */
let toastT=0;
function toast(s,ms=2600){const t=$('toast');t.textContent=s;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms);}

/* ---------- dźwięk ---------- */
let AC=null,master=null,muted=false;
function audioInit(){if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
    [[55,.05],[82.4,.035],[110.6,.025],[165,.012]].forEach(([f,v],i)=>{const o=AC.createOscillator(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();
      o.type='sine';o.frequency.value=f;g.gain.value=v;l.frequency.value=.05+i*.037;lg.gain.value=v*.6;l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(master);o.start();l.start();});
  }catch(e){AC=null;}}
function tone(f,d,type='sine',v=.1,slide=0,delay=0){if(!AC||muted)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);}
const lastSfx={};
function sfx(n){const now=performance.now(),gap={shoot:75,kill:35,hit:40,collect:30}[n]||0;if(now-(lastSfx[n]||0)<gap)return;lastSfx[n]=now;
  switch(n){
    case'shoot':tone(900,.09,'triangle',.05,-500);break;
    case'kill':tone(240,.16,'sawtooth',.06,-170);break;
    case'hit':tone(160,.05,'square',.025);break;
    case'collect':tone(1100+Math.random()*300,.08,'sine',.05,400);break;
    case'pulse':tone(120,.6,'sine',.2,-70);tone(480,.5,'triangle',.07,-300);break;
    case'core':tone(70,.45,'sawtooth',.16,-30);break;
    case'hurt':tone(200,.25,'square',.08,-130);break;
    case'wave':tone(196,.5,'triangle',.1);tone(294,.6,'triangle',.1,0,.12);tone(392,.8,'triangle',.1,0,.24);break;
    case'up':[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.08,0,i*.07));break;
    case'rev':tone(440,.3,'sine',.09,300);tone(660,.4,'sine',.09,300,.1);break;
    case'over':tone(220,1.2,'sawtooth',.12,-150);tone(165,1.5,'sawtooth',.1,-100,.2);break;
  }}

/* ---------- sieć ---------- */
function openChannel(name,onmsg){
  return new Promise((res,rej)=>{
    if(MODE==='local'){const bc=new BroadcastChannel(name);bc.onmessage=e=>onmsg(e.data);res({send:m=>bc.postMessage(m),close:()=>bc.close()});return;}
    if(!sb){if(!window.supabase){rej(new Error('Brak biblioteki Supabase'));return;}
      sb=window.supabase.createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:30}}});}
    const ch=sb.channel(name,{config:{broadcast:{self:false}}});
    ch.on('broadcast',{event:'m'},({payload})=>onmsg(payload));
    let done=false;const to=setTimeout(()=>{if(!done)rej(new Error('Timeout połączenia'));},8000);
    ch.subscribe(st=>{if(st==='SUBSCRIBED'&&!done){done=true;clearTimeout(to);res({send:m=>ch.send({type:'broadcast',event:'m',payload:m}),close:()=>sb.removeChannel(ch)});}
      else if((st==='CHANNEL_ERROR'||st==='TIMED_OUT')&&!done){done=true;clearTimeout(to);rej(new Error(st));}});
  });
}
const genCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s;};

async function startHost(){
  audioInit();me.name=getName();MODE=$('local').checked?'local':'sb';roomCode=genCode();
  try{net=await openChannel(PREFIX+'room_'+roomCode,onHostMsg);}catch(e){toast('Nie udało się połączyć: '+e.message);return;}
  isHost=true;joined=true;newGame(true);enterGame();toast('Pokój '+roomCode+' gotowy — wyślij kod znajomym');
}
async function startJoin(){
  audioInit();me.name=getName();MODE=$('local').checked?'local':'sb';
  const code=$('code').value.trim().toUpperCase();if(code.length!==4){toast('Wpisz 4-literowy kod pokoju');return;}
  roomCode=code;toast('Łączenie…',8000);
  try{net=await openChannel(PREFIX+'room_'+roomCode,onClientMsg);}catch(e){toast('Nie udało się połączyć: '+e.message);return;}
  isHost=false;joined=false;cv.lastSnap=performance.now();
  const t0=performance.now();
  const iv=setInterval(()=>{
    if(joined||!net){clearInterval(iv);return;}
    if(performance.now()-t0>4500){clearInterval(iv);toast('Nie znaleziono pokoju '+roomCode);leave(true);return;}
    net.send({t:'hello',id:me.id,name:me.name});
  },700);
  net.send({t:'hello',id:me.id,name:me.name});
}
function getName(){let n=$('name').value.trim().slice(0,12)||('Wąż'+Math.floor(rnd(100,999)));try{localStorage.setItem('gloworm_name',n);}catch(e){}return n;}
function enterGame(){inGame=true;$('menu').hidden=true;$('bar').hidden=false;$('rc').textContent=roomCode;
  try{history.replaceState(null,'','?room='+roomCode+(MODE==='local'?'&local=1':''));}catch(e){}}
function leave(silent){
  if(net){try{if(!isHost)net.send({t:'bye',id:me.id});net.close();}catch(e){}}
  net=null;isHost=false;inGame=false;joined=false;G=null;
  cv.pm.clear();cv.em.clear();cv.bm.clear();cv.sm.clear();cv.players=[];cv.enemies=[];cv.bullets=[];cv.sparks=[];cv.rn=-1;cv.wave=0;cv.ph='break';
  $('menu').hidden=false;$('bar').hidden=true;
}
addEventListener('beforeunload',()=>{if(net&&!isHost)try{net.send({t:'bye',id:me.id});}catch(e){}});

/* ---------- HOST: symulacja ---------- */
function newGame(first){
  const old=G?G.pl:[];
  G={pl:[],en:[],bu:[],sp:[],core:{hp:100,max:100},wave:0,ph:'break',wt:4,toSpawn:0,spawnCd:0,nid:1,ev:[],rn:(G?G.rn+1:0),time:0,hostId:me.id};
  if(first)addPlayer(me.id,me.name);
  else old.forEach(p=>addPlayer(p.id,p.name,p.hue));
  const mp=G.pl.find(p=>p.id===me.id);if(mp){me.x=mp.x;me.y=mp.y;me.vx=me.vy=0;}
}
function addPlayer(id,name,hue){
  const used=G.pl.map(p=>p.hue);if(hue===undefined)hue=HUES.find(h=>!used.includes(h))??HUES[G.pl.length%4];
  const ang=rnd(0,TAU);
  const p={id,name:name||'Wąż',hue,x:CX+Math.cos(ang)*110,y:CY+Math.sin(ang)*110,a:0,f:false,ps:0,psDone:0,hp:100,max:100,down:false,rv:0,tier:0,sp:0,score:0,fcd:0,pcd:0,inv:0,last:performance.now()};
  G.pl.push(p);return p;
}
function onHostMsg(m){
  if(!G||!m)return;
  if(m.t==='hello'){
    let p=G.pl.find(q=>q.id===m.id);
    if(!p){if(G.pl.length>=MAXP){net.send({t:'full',to:m.id});return;}p=addPlayer(m.id,String(m.name||'Wąż').slice(0,12));}
  }else if(m.t==='in'){
    const p=G.pl.find(q=>q.id===m.id);if(!p)return;
    p.last=performance.now();
    if(!p.down){p.x=clamp(+m.x||p.x,20,W-20);p.y=clamp(+m.y||p.y,20,H-20);}
    p.a=+m.a||0;p.f=!!m.f;p.ps=m.ps|0;
  }else if(m.t==='bye'){G.pl=G.pl.filter(q=>q.id!==m.id);}
}
const EDEF=[{hp:3,sp:62,dmg:8},{hp:2,sp:125,dmg:12},{hp:16,sp:42,dmg:25}];
function spawnEnemy(){
  const w=G.wave,wts=[10,w>=2?4+w:0,w>=3?1+w*.6:0],sum=wts[0]+wts[1]+wts[2];let r=Math.random()*sum,type=0;
  if(r>wts[0]){r-=wts[0];type=r>wts[1]?2:1;}
  let x,y;const s=Math.floor(Math.random()*4);
  if(s===0){x=rnd(0,W);y=-30;}else if(s===1){x=W+30;y=rnd(0,H);}else if(s===2){x=rnd(0,W);y=H+30;}else{x=-30;y=rnd(0,H);}
  const d=EDEF[type],hp=Math.ceil(d.hp*(1+w*.07));
  G.en.push({id:G.nid++,type,x,y,hp,max:hp,r:ER[type],sp:d.sp*(1+Math.min(.5,w*.02))*rnd(.9,1.1),dmg:d.dmg,ang:0,ph:rnd(0,TAU),fl:0});
}
function dropSparks(x,y,n){for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(40,150);G.sp.push({id:G.nid++,x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:16});}}
function killEnemy(e,ownerId){
  e.dead=true;G.ev.push([1,Math.round(e.x),Math.round(e.y),e.type]);
  dropSparks(e.x,e.y,e.type===2?6:1);
  const o=G.pl.find(p=>p.id===ownerId);if(o)o.score+=e.type===2?50:10;
}
function hurtPlayer(p,dmg){
  p.hp-=dmg;p.inv=1;G.ev.push([6,Math.round(p.x),Math.round(p.y)]);
  if(p.hp<=0){p.hp=0;p.down=true;p.rv=0;p.f=false;G.ev.push([11,Math.round(p.x),Math.round(p.y)]);}
}
function shoot(p){
  const T=TIERS[p.tier];p.fcd=T.cd;
  for(let i=0;i<T.n;i++){
    let a=p.a+(i-(T.n-1)/2)*T.sp,ox=0,oy=0;
    if(T.par){const s=i===0?-1:1;ox=-Math.sin(p.a)*7*s;oy=Math.cos(p.a)*7*s;}
    G.bu.push({id:G.nid++,x:p.x+Math.cos(p.a)*14+ox,y:p.y+Math.sin(p.a)*14+oy,vx:Math.cos(a)*790,vy:Math.sin(a)*790,life:1.05,hue:p.hue,own:p.id});
  }
}
function pulse(p){
  p.pcd=PULSE_CD;G.ev.push([4,Math.round(p.x),Math.round(p.y),p.hue]);
  for(const e of G.en){const dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy);
    if(d<PULSE_R+e.r){e.hp-=4;e.fl=.15;const k=(e.type===2?30:70)/(d||1);e.x+=dx*k;e.y+=dy*k;if(e.hp<=0&&!e.dead)killEnemy(e,p.id);}}
}
function hostStep(dt){
  const g=G;g.time+=dt;
  // lokalny gracz-host
  const hp0=g.pl.find(p=>p.id===me.id);
  if(hp0){hp0.last=performance.now();if(!hp0.down){hp0.x=me.x;hp0.y=me.y;}hp0.a=me.a;hp0.f=me.f;hp0.ps=me.ps;}
  const now=performance.now();
  g.pl=g.pl.filter(p=>p.id===me.id||now-p.last<7000);
  if(g.ph==='over')return;
  const alive=g.pl.filter(p=>!p.down);
  // gracze
  for(const p of g.pl){
    p.inv=Math.max(0,p.inv-dt);p.fcd-=dt;p.pcd=Math.max(0,p.pcd-dt);
    if(p.ps!==p.psDone){p.psDone=p.ps;if(p.pcd<=0&&!p.down)pulse(p);}
    if(p.down){
      const near=g.pl.some(q=>!q.down&&Math.hypot(q.x-p.x,q.y-p.y)<70);
      p.rv=clamp(p.rv+(near?dt:-dt*.5),0,2.5);
      if(p.rv>=2.5){p.down=false;p.hp=50;p.inv=2;p.rv=0;g.ev.push([8,Math.round(p.x),Math.round(p.y)]);}
    }else if(p.f&&p.fcd<=0)shoot(p);
  }
  // pociski
  for(const b of g.bu){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.x<-40||b.x>W+40||b.y<-40||b.y>H+40)b.life=0;
    if(b.life<=0)continue;
    for(const e of g.en){if(e.dead)continue;const dx=e.x-b.x,dy=e.y-b.y,r=e.r+5;
      if(dx*dx+dy*dy<r*r){e.hp-=1;e.fl=.12;b.life=0;g.ev.push([2,Math.round(b.x),Math.round(b.y)]);if(e.hp<=0)killEnemy(e,b.own);break;}}}
  g.bu=g.bu.filter(b=>b.life>0);
  // wrogowie
  for(const e of g.en){
    if(e.dead)continue;
    let tx=CX,ty=CY;
    if(e.type===1&&alive.length){let bd=1e9;for(const p of alive){const d=Math.hypot(p.x-e.x,p.y-e.y);if(d<bd){bd=d;tx=p.x;ty=p.y;}}}
    const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy)||1;
    e.ang=Math.atan2(dy,dx);e.ph+=dt*4;
    const wob=Math.sin(e.ph)*.35;
    e.x+=(dx/d*Math.cos(wob)-dy/d*Math.sin(wob))*e.sp*dt;
    e.y+=(dy/d*Math.cos(wob)+dx/d*Math.sin(wob))*e.sp*dt;
    e.fl=Math.max(0,e.fl-dt*0);
    // rdzeń
    if(Math.hypot(e.x-CX,e.y-CY)<CORE_R+e.r*.6){g.core.hp-=e.dmg;e.dead=true;g.ev.push([5,Math.round(e.x),Math.round(e.y)]);continue;}
    for(const p of alive){
      if(p.down||p.inv>0)continue;
      if(Math.hypot(p.x-e.x,p.y-e.y)<e.r+11){hurtPlayer(p,e.dmg);if(e.type!==2)e.dead=true;break;}
    }
  }
  // rozpychanie wrogów
  const E=g.en;
  for(let i=0;i<E.length;i++){const a=E[i];if(a.dead)continue;
    for(let j=i+1;j<E.length;j++){const b=E[j];if(b.dead)continue;const dx=b.x-a.x,dy=b.y-a.y,m=a.r+b.r,d2=dx*dx+dy*dy;
      if(d2<m*m&&d2>.01){const d=Math.sqrt(d2),k=(m-d)*.5/d;a.x-=dx*k;a.y-=dy*k;b.x+=dx*k;b.y+=dy*k;}}}
  g.en=E.filter(e=>!e.dead);
  // iskry
  for(const s of g.sp){
    s.life-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;const dr=Math.pow(.05,dt);s.vx*=dr;s.vy*=dr;
    let tgt=null,bd=150;for(const p of alive){const d=Math.hypot(p.x-s.x,p.y-s.y);if(d<bd){bd=d;tgt=p;}}
    if(tgt){const dx=tgt.x-s.x,dy=tgt.y-s.y,d=Math.hypot(dx,dy)||1,v=420;s.x+=dx/d*v*dt;s.y+=dy/d*v*dt;
      if(d<24){s.life=0;tgt.sp++;tgt.score++;g.ev.push([3,Math.round(s.x),Math.round(s.y)]);
        let t=0;for(let i=0;i<TH.length;i++)if(tgt.sp>=TH[i])t=i;
        if(t>tgt.tier){tgt.tier=t;g.ev.push([9,Math.round(tgt.x),Math.round(tgt.y),t,tgt.hue]);}}}
  }
  g.sp=g.sp.filter(s=>s.life>0);
  // fale
  if(g.ph==='break'){
    g.wt-=dt;
    if(g.wt<=0){g.wave++;g.ph='wave';g.toSpawn=5+g.wave*3+(g.pl.length-1)*3;g.spawnCd=.5;g.ev.push([7,g.wave]);}
  }else if(g.ph==='wave'){
    g.spawnCd-=dt;
    if(g.toSpawn>0&&g.spawnCd<=0){spawnEnemy();g.toSpawn--;g.spawnCd=Math.max(.2,1.1-g.wave*.06)/(1+(g.pl.length-1)*.3);}
    if(g.toSpawn<=0&&g.en.length===0){
      g.ph='break';g.wt=7;g.core.hp=Math.min(g.core.max,g.core.hp+18);
      for(const p of g.pl){if(p.down){p.down=false;p.hp=50;p.inv=2;p.rv=0;g.ev.push([8,Math.round(p.x),Math.round(p.y)]);}else p.hp=Math.min(p.max,p.hp+30);}
    }
  }
  if(g.core.hp<=0||(g.pl.length&&g.pl.every(p=>p.down))){g.core.hp=Math.max(0,g.core.hp);g.ph='over';g.ev.push([10]);}
}

function syncMap(map,arr,mk){
  const seen=new Set();
  for(const a of arr){let o=map.get(a[0]);const fresh=!o;if(fresh)o={id:a[0]};mk(o,a,fresh);if(fresh){o.x=o.tx;o.y=o.ty;map.set(a[0],o);}seen.add(a[0]);}
  for(const k of Array.from(map.keys()))if(!seen.has(k))map.delete(k);
}
function onClientMsg(m){
  if(!m)return;
  if(m.t==='full'&&m.to===me.id&&!joined){toast('Pokój jest pełny (max '+MAXP+')');leave(true);return;}
  if(m.t!=='st')return;
  cv.lastSnap=performance.now();
  cv.wave=m.w;cv.ph=m.ph;cv.core.hp=m.ch;cv.core.max=m.cm;cv.wt=m.wt;cv.left=m.lf;
  syncMap(cv.pm,m.p,(o,a,fresh)=>{o.name=a[1];o.hue=a[2];o.tx=a[3];o.ty=a[4];o.ta=a[5];if(fresh)o.a=o.ta;
    if(o.hp!==undefined&&a[6]<o.hp&&a[0]!==me.id)o.fl=.15;
    o.hp=a[6];o.max=100;o.down=!!a[7];o.rv=a[8];o.tier=a[9];o.sp=a[10];o.score=a[11];o.pc=a[12];});
  syncMap(cv.em,m.e,(o,a,fresh)=>{o.type=a[1];o.tx=a[2];o.ty=a[3];if(!fresh&&a[4]<o.hp)o.fl=.12;o.hp=a[4];o.max=a[5];o.r=ER[o.type];if(fresh){o.ang=0;o.ph=rnd(0,TAU);o.fl=0;}});
  syncMap(cv.bm,m.b,(o,a)=>{o.tx=a[1];o.ty=a[2];o.hue=a[3];});
  syncMap(cv.sm,m.s,(o,a)=>{o.tx=a[1];o.ty=a[2];});
  cv.players=Array.from(cv.pm.values());cv.enemies=Array.from(cv.em.values());cv.bullets=Array.from(cv.bm.values());cv.sparks=Array.from(cv.sm.values());
  const mp=cv.pm.get(me.id);
  if(mp&&!joined){joined=true;me.x=mp.tx;me.y=mp.ty;enterGame();toast('Dołączono do pokoju '+roomCode);}
  if(mp&&m.rn!==cv.rn){me.x=mp.tx;me.y=mp.ty;me.vx=me.vy=0;if(mp.trail)mp.trail.length=0;}
  cv.rn=m.rn;
  processEvents(m.ev);
}
function easeClient(dt){
  const k=1-Math.exp(-dt*16);
  for(const map of [cv.pm,cv.em,cv.bm,cv.sm])for(const o of map.values()){
    if(o.id===me.id&&map===cv.pm)continue;
    const dx=o.tx-o.x,dy=o.ty-o.y;
    if(o.ang!==undefined&&dx*dx+dy*dy>.6)o.ang=Math.atan2(dy,dx);
    o.x+=dx*k;o.y+=dy*k;
    if(o.ta!==undefined){let da=o.ta-o.a;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;o.a+=da*k;}
  }
}

function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-(frame.l||now))/1000);frame.l=now;T+=dt;
  if(inGame)localUpdate(dt);
  if(!isHost&&inGame)easeClient(dt);
  const R=view();
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#01040a';ctx.fillRect(0,0,VW,VH);
  shake=Math.max(0,shake-dt*22);
  const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;
  ctx.setTransform(DPR*SC,0,0,DPR*SC,DPR*(OX+sx),DPR*(OY+sy));
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  ctx.drawImage(BG,0,0);
  // promienie światła
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<5;i++){const x=200+i*330+Math.sin(T*.2+i*2)*90,w=60+30*Math.sin(T*.3+i);
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(90,190,230,.07)');g.addColorStop(1,'rgba(90,190,230,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-w,0);ctx.lineTo(x+w,0);ctx.lineTo(x+w*3+Math.sin(T*.15+i)*80,H);ctx.lineTo(x-w*3+Math.sin(T*.15+i)*80,H);ctx.closePath();ctx.fill();}
  // morski śnieg
  ctx.fillStyle='#9fe8ff';
  for(const s of snow){s.y-=dt*(6+s.z*14);s.x+=Math.sin(T*.5+s.p)*dt*8;if(s.y<-4){s.y=H+4;s.x=rnd(0,W);}
    ctx.globalAlpha=.15+.35*s.z;ctx.fillRect(s.x,s.y,1+s.z*1.8,1+s.z*1.8);}
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  drawCore(R.core,T);
  // iskry
  ctx.globalCompositeOperation='lighter';
  for(const s of R.sparks){const b=Math.sin(T*6+s.id)*2;dg(s.x,s.y,14+b,55,.9,60);ctx.globalAlpha=1;ctx.fillStyle='#fff7c2';ctx.beginPath();ctx.arc(s.x,s.y,2.4,0,TAU);ctx.fill();}
  for(const b of R.bullets){dg(b.x,b.y,20,b.hue,.9,60);ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,2.8,0,TAU);ctx.fill();}
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  for(const e of R.enemies){if(e.fl>0)e.fl-=dt;drawEnemy(e);}
  for(const p of R.players){
    if(p.id===me.id){p.x=me.x;p.y=me.y;p.a=me.a;}
    if(p.fl>0)p.fl-=dt;
    drawPlayer(p,p.id===me.id);
  }
  // cząsteczki
  ctx.globalCompositeOperation='lighter';
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.l-=dt;if(q.l<=0){parts.splice(i,1);continue;}
    q.x+=q.vx*dt;q.y+=q.vy*dt;const d=Math.pow(.04,dt);q.vx*=d;q.vy*=d;dg(q.x,q.y,q.s*(.4+q.l/q.m),q.h,clamp(q.l/q.m,0,1),58);}
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.l-=dt;if(r.l<=0){rings.splice(i,1);continue;}
    const f=1-r.l/r.m,rad=r.r+(r.mr-r.r)*(1-Math.pow(1-f,3));
    ctx.globalAlpha=(1-f)*.9;ctx.strokeStyle=`hsl(${r.h},100%,70%)`;ctx.lineWidth=5*(1-f)+1;ctx.beginPath();ctx.arc(r.x,r.y,rad,0,TAU);ctx.stroke();
    dg(r.x,r.y,rad*1.15,r.h,(1-f)*.25,50);}
  ctx.globalCompositeOperation='source-over';
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.l-=dt;if(f.l<=0){floats.splice(i,1);continue;}f.y-=dt*28;
    ctx.globalAlpha=clamp(f.l/f.m*2,0,1);ctx.fillStyle=`hsl(${f.h},100%,75%)`;ctx.font='700 22px Orbitron,sans-serif';ctx.textAlign='center';ctx.fillText(f.txt,f.x,f.y);}
  ctx.globalAlpha=1;
  ctx.restore();
  // ramka areny
  ctx.strokeStyle='rgba(90,210,255,.18)';ctx.lineWidth=2/SC;ctx.strokeRect(0,0,W,H);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(inGame)drawHUD(R,dt);
  // host wyszedł?
  if(inGame&&!isHost&&joined&&performance.now()-cv.lastSnap>5000){toast('Host opuścił grę');leave(true);}
}
function drawHUD(R,dt){
  const f=(s)=>`${s}px Rajdhani,sans-serif`;
  ctx.textBaseline='alphabetic';
  // serce rafy
  const bw=Math.min(360,VW-40),bx=(VW-bw)/2;
  ctx.textAlign='center';ctx.fillStyle='#ffd978';ctx.font='700 13px Rajdhani,sans-serif';ctx.fillText('SERCE RAFY',VW/2,20);
  ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(bx,26,bw,10);
  const cf=clamp(R.core.hp/R.core.max,0,1);ctx.fillStyle=`hsl(${cf*120},90%,55%)`;ctx.fillRect(bx,26,bw*cf,10);
  // fala
  ctx.textAlign='left';ctx.fillStyle='#e8fbff';ctx.font='900 24px Orbitron,sans-serif';ctx.fillText('FALA '+Math.max(1,R.wave),16,34);
  ctx.fillStyle='#7fb0c4';ctx.font=f(15);
  ctx.fillText(R.ph==='wave'?'wrogów: '+R.left:R.ph==='break'?(R.wave===0?'start za ':'następna za ')+Math.ceil(R.wt)+'s':'',16,54);
  // lista graczy
  let y=82;
  for(const p of R.players){
    const h=p.hue;ctx.fillStyle=`hsl(${h},100%,65%)`;ctx.beginPath();ctx.arc(24,y-5,5,0,TAU);ctx.fill();
    ctx.fillStyle=p.down?'#7a8f99':'#d8f6ff';ctx.font=f(16);ctx.fillText(p.name+(p.id===me.id?' (Ty)':''),38,y);
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(38,y+4,90,5);ctx.fillStyle=p.down?'#556':`hsl(${p.hp*1.2},90%,55%)`;ctx.fillRect(38,y+4,90*p.hp/100,5);
    ctx.fillStyle=`hsl(${h},100%,70%)`;ctx.font=f(13);ctx.fillText('★'.repeat(p.tier+1)+'  '+p.score+' pkt',136,y+9);
    y+=32;
  }
  // puls
  const mp=R.players.find(p=>p.id===me.id);
  const cd=mp?(isHost?mp.pcd/PULSE_CD:mp.pc):0;
  const pw=Math.min(220,VW-40),px=(VW-pw)/2,py=VH-34;
  ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(px,py,pw,8);
  ctx.fillStyle=cd<=0?'#5dffe6':'#2a7a8a';ctx.fillRect(px,py,pw*(1-clamp(cd,0,1)),8);
  ctx.textAlign='center';ctx.font=f(14);ctx.fillStyle=cd<=0?'#9ff':'#6f9bb0';ctx.fillText(cd<=0?'PULS GOTOWY — SPACJA':'puls się ładuje…',VW/2,py-6);
  if(R.wave<=1&&R.ph==='break'&&R.players.length<2){ctx.fillStyle='#9fd';ctx.font=f(17);ctx.fillText('Wyślij kod pokoju znajomym — '+roomCode,VW/2,VH*.82);}
  // baner
  if(banner){banner.l-=dt;if(banner.l<=0)banner=null;else{
    const a=banner.m>50?1:clamp(Math.min(banner.l,banner.m-banner.l)*2.5,0,1);
    ctx.globalAlpha=a;ctx.textAlign='center';ctx.font='900 '+Math.min(80,VW/9)+'px Orbitron,sans-serif';
    ctx.shadowColor='#2ef2ff';ctx.shadowBlur=30;ctx.fillStyle='#fff';ctx.fillText(banner.txt,VW/2,VH*.4);ctx.shadowBlur=0;ctx.globalAlpha=1;}}
  if(R.ph==='over'){
    ctx.fillStyle='rgba(1,4,10,.55)';ctx.fillRect(0,0,VW,VH);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='900 '+Math.min(64,VW/10)+'px Orbitron,sans-serif';ctx.shadowColor='#ff3fd0';ctx.shadowBlur=26;
    ctx.fillText('RAFA ZGASŁA',VW/2,VH*.38);ctx.shadowBlur=0;
    ctx.font=f(26);ctx.fillStyle='#ffd978';ctx.fillText('Dotrwaliście do fali '+Math.max(1,R.wave),VW/2,VH*.38+44);
    ctx.font=f(20);ctx.fillStyle='#bfe';
    const sorted=[...R.players].sort((a,b)=>b.score-a.score);
    sorted.forEach((p,i)=>{ctx.fillStyle=`hsl(${p.hue},100%,75%)`;ctx.fillText(`${i+1}. ${p.name} — ${p.score} pkt`,VW/2,VH*.38+84+i*28);});
    ctx.fillStyle='#9ff';ctx.font=f(20);ctx.fillText(isHost?'ENTER lub kliknięcie — zagraj ponownie':'Czekaj, aż host zacznie nową grę…',VW/2,VH*.38+84+sorted.length*28+30);
  }
}

/* ---------- sterowanie ---------- */
const keys={},mouse={x:CX,y:CY,down:false};
const typing=()=>document.activeElement&&document.activeElement.tagName==='INPUT'&&document.activeElement.type==='text';
function trigPulse(){me.ps=(me.ps+1)|0;const mp=meP();if(mp&&!mp.down)audioInit();}
addEventListener('keydown',e=>{
  if(typing())return;
  keys[e.code]=true;
  if(e.code==='Space'||e.code==='ShiftLeft'){e.preventDefault();if(!e.repeat&&inGame)trigPulse();}
  if(e.code==='KeyM')toggleMute();
  if(e.code==='Enter'&&inGame&&isHost&&G&&G.ph==='over')newGame(false);
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.down=false;});
function setMouse(e){mouse.x=(e.clientX-OX)/SC;mouse.y=(e.clientY-OY)/SC;}
cv2.addEventListener('mousemove',setMouse);
cv2.addEventListener('mousedown',e=>{setMouse(e);audioInit();
  if(e.button===2){if(inGame)trigPulse();return;}
  mouse.down=true;
  if(inGame&&isHost&&G&&G.ph==='over')newGame(false);});
addEventListener('mouseup',()=>{mouse.down=false;});
cv2.addEventListener('contextmenu',e=>e.preventDefault());
cv2.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];setMouse(t);mouse.down=true;},{passive:false});
cv2.addEventListener('touchmove',e=>{e.preventDefault();setMouse(e.touches[0]);},{passive:false});
cv2.addEventListener('touchend',()=>{mouse.down=false;});

let lastShootSfx=0;
function localUpdate(dt){
  const mp=meP(),down=mp&&mp.down,dead=view().ph==='over';
  let dx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  let dy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  const l=Math.hypot(dx,dy);if(l){dx/=l;dy/=l;}
  const sp=(down||dead)?0:255,k=Math.min(1,dt*9);
  me.vx+=(dx*sp-me.vx)*k;me.vy+=(dy*sp-me.vy)*k;
  me.x=clamp(me.x+me.vx*dt,22,W-22);me.y=clamp(me.y+me.vy*dt,22,H-22);
  me.a=Math.atan2(mouse.y-me.y,mouse.x-me.x);
  me.f=mouse.down&&!down&&!dead;
  if(me.f&&performance.now()-lastShootSfx>(TIERS[mp?mp.tier:0].cd*1000)){lastShootSfx=performance.now();sfx('shoot');}
}

/* ---------- pętla symulacji / sieci ---------- */
let lastT=performance.now(),netAcc=0,inAcc=0;
setInterval(()=>{
  const now=performance.now();let dt=Math.min(.1,(now-lastT)/1000);lastT=now;
  if(isHost&&G&&net){
    hostStep(dt);
    // zdarzenia hosta też mają się odtworzyć u hosta
    if(G.ev.length>(G.evSeen|0)){processEvents(G.ev.slice(G.evSeen|0));G.evSeen=G.ev.length;}
    netAcc+=dt;if(netAcc>=.1){netAcc=0;broadcast();G.ev=[];G.evSeen=0;}
    else if(G.pl.length<2){G.ev=[];G.evSeen=0;}
  }else if(!isHost&&net&&joined){
    inAcc+=dt;if(inAcc>=.1){inAcc=0;net.send({t:'in',id:me.id,x:Math.round(me.x),y:Math.round(me.y),a:+me.a.toFixed(2),f:me.f?1:0,ps:me.ps});}
  }
},16);

/* ---------- UI ---------- */
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:.55;$('mute').textContent=muted?'Dźwięk: wył.':'Dźwięk';}
$('create').onclick=startHost;
$('join').onclick=startJoin;
$('leave').onclick=()=>leave();
$('mute').onclick=toggleMute;
$('copy').onclick=async()=>{
  const url=location.origin+location.pathname+'?room='+roomCode+(MODE==='local'?'&local=1':'');
  try{await navigator.clipboard.writeText(url);toast('Link skopiowany: '+url);}catch(e){toast(url,5000);}
};
$('code').addEventListener('keydown',e=>{if(e.key==='Enter')startJoin();});
$('code').addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z]/g,'');});
(function init(){
  const q=new URLSearchParams(location.search);
  try{$('name').value=localStorage.getItem('gloworm_name')||'';}catch(e){}
  if(q.get('local'))$('local').checked=true;
  if(q.get('room'))$('code').value=q.get('room').toUpperCase().slice(0,4);
})();
requestAnimationFrame(frame);
</script>
