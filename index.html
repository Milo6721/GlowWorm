<style>

canvas{position:fixed;inset:0;display:block;cursor:crosshair;touch-action:none}

  background:radial-gradient(ellipse at 50% 40%,rgba(2,20,40,.35),rgba(1,4,10,.82))}
.card{width:min(440px,100%);text-align:center;margin:auto}
h1{font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(40px,9vw,68px);letter-spacing:.06em;line-height:1;

#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:rgba(3,16,30,.92);border:1px solid var(--mg);
  color:var(--ink);padding:10px 18px;border-radius:10px;font-weight:600;font-size:17px;opacity:0;pointer-events:none;transition:.25s;z-index:9;text-align:center;max-width:90vw}

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
'use strict';
/* ============================================================
   GLOWORM — Reef Defense  v2
   Co-op: host liczy symulację, reszta wysyła sterowanie.
   Sieć: Supabase Realtime Broadcast (kanały gloworm_room_XXXX)
   — żadnych tabel w bazie.
   ============================================================ */
const SB_URL='https://ibafumzehizoamwiixlc.supabase.co';
const SB_KEY='sb_publishable_1pJjII-6FCQGkIbqcKuTiQ_QPtZw8bv';
const PREFIX='gloworm_';
const W=2400,H=1400,CX=1200,CY=700,TAU=Math.PI*2,CORE_R=48,MAXP=4;
const VIEWW=1100,VIEWH=640;                 // ile świata widać (jednostki)
const HUES=[175,320,48,135];
const PULSE_CD=7,PULSE_R=200;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const cv2=$('c'),ctx=cv2.getContext('2d');
const IS_TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const LOWFX=IS_TOUCH;

/* ---------- definicje ---------- */
// typy wrogów: 0 meduza,1 kłapacz,2 jeżowiec,3 pluj,4 gąbka,5 pędrak,6 pijawka,7 boss
const ED=[
 {n:'meduza',   r:15,hp:3, sp:70, dmg:8, cost:1,hue:290,drop:1},
 {n:'kłapacz',  r:13,hp:3, sp:100,dmg:12,cost:2,hue:5,  drop:1},
 {n:'jeżowiec', r:32,hp:18,sp:44, dmg:25,cost:6,hue:22, drop:6},
 {n:'pluj',     r:17,hp:5, sp:75, dmg:10,cost:3,hue:325,drop:2},
 {n:'gąbka',    r:20,hp:6, sp:55, dmg:10,cost:3,hue:95, drop:2},
 {n:'pędrak',   r:9, hp:1, sp:125,dmg:6, cost:0,hue:95, drop:0},
 {n:'pijawka',  r:13,hp:5, sp:95, dmg:0, cost:3,hue:25, drop:2},
 {n:'LEWIATAN', r:72,hp:110,sp:30,dmg:60,cost:10,hue:350,drop:16},
];
const CARDS=[
 {n:'Salwa',          d:'+1 pocisk w każdej salwie',            ic:'🔱',h:175,max:4},
 {n:'Szybkostrzał',   d:'+25% szybkości strzelania',            ic:'⚡',h:50, max:6},
 {n:'Mocny ładunek',  d:'+1 obrażeń, większe pociski',          ic:'💥',h:320,max:5},
 {n:'Przebicie',      d:'pociski przebijają +1 wroga',          ic:'🏹',h:200,max:4},
 {n:'Naprowadzanie',  d:'pociski skręcają do wrogów',           ic:'🎯',h:140,max:3},
 {n:'Światełka',      d:'+1 orbitujące światło rani i osłania', ic:'💫',h:55, max:5},
 {n:'Płetwy',         d:'+15% szybkości pływania',              ic:'🐟',h:190,max:4},
 {n:'Magnes iskier',  d:'+60% zasięgu zbierania iskier',        ic:'🧲',h:60, max:3},
 {n:'Silny puls',     d:'puls szybciej się ładuje, większy zasięg',ic:'🌊',h:170,max:3},
 {n:'Pancerz',        d:'+30 max HP i pełne leczenie',          ic:'🛡️',h:130,max:4},
 {n:'Światło Rafy',   d:'Serce Rafy odzyskuje 30 HP',           ic:'💗',h:40, max:99},
];
const cumXP=l=>Math.round(12*Math.pow(l+1,1.5));   // iskry potrzebne, by wejść na poziom l+1

/* ---------- ekran / kamera ---------- */
let VW,VH,DPR,SC;
const cam={x:CX-VIEWW/2,y:CY-VIEWH/2,init:false};
function resize(){DPR=Math.min(LOWFX?1.5:2,window.devicePixelRatio||1);VW=innerWidth;VH=innerHeight;
  cv2.width=Math.round(VW*DPR);cv2.height=Math.round(VH*DPR);cv2.style.width=VW+'px';cv2.style.height=VH+'px';
  SC=Math.max(VW/VIEWW,VH/VIEWH);}
addEventListener('resize',resize);resize();
const s2w=(sx,sy)=>({x:cam.x+sx/SC,y:cam.y+sy/SC});

/* ---------- stan globalny ---------- */
const me={id:Math.random().toString(36).slice(2,9),name:'',x:CX,y:CY+120,vx:0,vy:0,a:0,f:false,ps:0,auto:IS_TOUCH};
let isHost=false,inGame=false,joined=false,net=null,roomCode='',MODE='sb',sb=null;
let G=null;
const cv={pm:new Map(),em:new Map(),bm:new Map(),sm:new Map(),xm:new Map(),players:[],enemies:[],bullets:[],sparks:[],ebul:[],
  core:{hp:100,max:100},wave:0,ph:'break',left:0,wt:3,pr:0,rn:-1,lastSnap:0};
const view=()=>(isHost&&G)?{players:G.pl,enemies:G.en,bullets:G.bu,sparks:G.sp,ebul:G.eb,core:G.core,wave:G.wave,ph:G.ph,wt:G.wt,pr:progress(G)}:cv;
const meP=()=>view().players.find(p=>p.id===me.id);

let toastT=0;
function toast(s,ms=2600){const t=$('toast');t.textContent=s;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms);}

/* ---------- dźwięk ---------- */
let AC=null,master=null,muted=false;
function audioInit(){if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.55;master.connect(AC.destination);
    [[55,.05],[82.4,.035],[110.6,.025],[165,.012]].forEach(([f,v],i)=>{const o=AC.createOscillator(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();
      o.type='sine';o.frequency.value=f;g.gain.value=v;l.frequency.value=.05+i*.037;lg.gain.value=v*.6;l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(master);o.start();l.start();});
  }catch(e){AC=null;}}
function tone(f,d,type='sine',v=.1,slide=0,delay=0){if(!AC||muted)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);}
const lastSfx={};
function sfx(n){const now=performance.now(),gap={shoot:80,kill:35,hit:45,collect:30,spit:120}[n]||0;if(now-(lastSfx[n]||0)<gap)return;lastSfx[n]=now;
  switch(n){
    case'shoot':tone(900,.09,'triangle',.045,-500);break;
    case'kill':tone(240,.16,'sawtooth',.055,-170);break;
    case'hit':tone(160,.05,'square',.02);break;
    case'collect':tone(1100+Math.random()*300,.08,'sine',.045,400);break;
    case'pulse':tone(120,.6,'sine',.2,-70);tone(480,.5,'triangle',.07,-300);break;
    case'core':tone(70,.45,'sawtooth',.16,-30);break;
    case'hurt':tone(200,.25,'square',.08,-130);break;
    case'spit':tone(300,.18,'sine',.05,-180);break;
    case'wave':tone(196,.5,'triangle',.1);tone(294,.6,'triangle',.1,0,.12);tone(392,.8,'triangle',.1,0,.24);break;
    case'boss':tone(65,1.6,'sawtooth',.16,-25);tone(98,1.4,'sawtooth',.1,-20,.1);break;
    case'up':[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.08,0,i*.07));break;
    case'rev':tone(440,.3,'sine',.09,300);tone(660,.4,'sine',.09,300,.1);break;
    case'over':tone(220,1.2,'sawtooth',.12,-150);tone(165,1.5,'sawtooth',.1,-100,.2);break;
  }}
let musT=0,beatT=0;
function music(dt,R){
  if(!AC||muted)return;
  musT-=dt;beatT-=dt;
  if(musT<=0){const pent=[0,2,4,7,9],n=196*Math.pow(2,pent[rint(0,4)]/12)*(Math.random()<.3?2:1);
    tone(n,2.2,'sine',.022);musT=rnd(1.1,2.4)/(R.ph==='wave'?1.7:1);}
  if(beatT<=0){const hot=R.ph==='wave';tone(52,.3,'sine',hot?.14:.07,-18);tone(52,.25,'sine',hot?.09:.04,-18,.18);beatT=hot?.75:1.3;}
}

/* ---------- sieć ---------- */
function openChannel(name,onmsg){
  return new Promise((res,rej)=>{
    if(MODE==='local'){const bc=new BroadcastChannel(name);bc.onmessage=e=>onmsg(e.data);res({send:m=>bc.postMessage(m),close:()=>bc.close()});return;}
    if(!sb){if(!window.supabase){rej(new Error('Brak biblioteki Supabase'));return;}
      sb=window.supabase.createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:30}}});}
    const ch=sb.channel(name,{config:{broadcast:{self:false}}});
    ch.on('broadcast',{event:'m'},({payload})=>onmsg(payload));
    let done=false;const to=setTimeout(()=>{if(!done)rej(new Error('Timeout połączenia'));},8000);
    ch.subscribe(st=>{if(st==='SUBSCRIBED'&&!done){done=true;clearTimeout(to);res({send:m=>ch.send({type:'broadcast',event:'m',payload:m}),close:()=>sb.removeChannel(ch)});}
      else if((st==='CHANNEL_ERROR'||st==='TIMED_OUT')&&!done){done=true;clearTimeout(to);rej(new Error(st));}});
  });
}
const genCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s;};

async function startHost(){
  audioInit();me.name=getName();MODE=$('local').checked?'local':'sb';roomCode=genCode();
  try{net=await openChannel(PREFIX+'room_'+roomCode,onHostMsg);}catch(e){toast('Nie udało się połączyć: '+e.message);return;}
  isHost=true;joined=true;newGame(true);enterGame();toast('Pokój '+roomCode+' gotowy — wyślij kod znajomym',3500);
}
async function startJoin(){
  audioInit();me.name=getName();MODE=$('local').checked?'local':'sb';
  const code=$('code').value.trim().toUpperCase();if(code.length!==4){toast('Wpisz 4-literowy kod pokoju');return;}
  roomCode=code;toast('Łączenie…',8000);
  try{net=await openChannel(PREFIX+'room_'+roomCode,onClientMsg);}catch(e){toast('Nie udało się połączyć: '+e.message);return;}
  isHost=false;joined=false;cv.lastSnap=performance.now();
  const t0=performance.now();
  const iv=setInterval(()=>{
    if(joined||!net){clearInterval(iv);return;}
    if(performance.now()-t0>4500){clearInterval(iv);toast('Nie znaleziono pokoju '+roomCode);leave(true);return;}
    net.send({t:'hello',id:me.id,name:me.name});
  },700);
  net.send({t:'hello',id:me.id,name:me.name});
}
function getName(){let n=$('name').value.trim().slice(0,12)||('Wąż'+Math.floor(rnd(100,999)));try{localStorage.setItem('gloworm_name',n);}catch(e){}return n;}
function enterGame(){inGame=true;cam.init=false;$('menu').hidden=true;$('bar').hidden=false;$('rc').textContent=roomCode;updAutoBtn();
  try{history.replaceState(null,'','?room='+roomCode+(MODE==='local'?'&local=1':''));}catch(e){}}
function leave(silent){
  if(net){try{if(!isHost)net.send({t:'bye',id:me.id});net.close();}catch(e){}}
  net=null;isHost=false;inGame=false;joined=false;G=null;
  for(const m of [cv.pm,cv.em,cv.bm,cv.sm,cv.xm])m.clear();
  cv.players=[];cv.enemies=[];cv.bullets=[];cv.sparks=[];cv.ebul=[];cv.rn=-1;cv.wave=0;cv.ph='break';
  $('menu').hidden=false;$('bar').hidden=true;
}
addEventListener('beforeunload',()=>{if(net&&!isHost)try{net.send({t:'bye',id:me.id});}catch(e){}});

/* ---------- HOST: gracze i ulepszenia ---------- */
function newGame(first){
  const old=G?G.pl:[];
  G={pl:[],en:[],bu:[],sp:[],eb:[],core:{hp:100,max:100},wave:0,ph:'break',wt:4,budget:0,bTotal:1,bossPending:false,spawnCd:0,nid:1,ev:[],evSeen:0,rn:(G?G.rn+1:0),time:0};
  if(first)addPlayer(me.id,me.name);else old.forEach(p=>addPlayer(p.id,p.name,p.hue));
  const mp=G.pl.find(p=>p.id===me.id);if(mp){me.x=mp.x;me.y=mp.y;me.vx=me.vy=0;}
}
function addPlayer(id,name,hue){
  const used=G.pl.map(p=>p.hue);if(hue===undefined)hue=HUES.find(h=>!used.includes(h))??HUES[G.pl.length%4];
  const ang=rnd(0,TAU);
  const p={id,name:name||'Wąż',hue,x:CX+Math.cos(ang)*120,y:CY+Math.sin(ang)*120,a:0,f:false,ps:0,psDone:0,hp:100,maxhp:100,down:false,rv:0,
    sp:0,lvl:0,score:0,fcd:0,pcd:0,pc:0,inv:0,last:performance.now(),st:new Array(CARDS.length).fill(0),picks:0,offer:null,pickT:0,u:null,orb:0,spd:100,ocd:0};
  recalc(p);G.pl.push(p);return p;
}
function recalc(p){
  const s=p.st;
  p.u={n:1+s[0],rate:1+.25*s[1],dmg:1+s[2],pierce:s[3],home:s[4],mag:1+.6*s[7],pcdM:Math.pow(.7,s[8]),pR:PULSE_R*(1+.15*s[8])};
  p.orb=s[5];p.spd=Math.round((1+.15*s[6])*100);p.maxhp=100+30*s[9];
}
function makeOffer(p){
  const pool=[];CARDS.forEach((c,i)=>{if(p.st[i]<c.max)for(let k=0;k<(i===10?(G.core.hp<G.core.max*.7?2:1):3);k++)pool.push(i);});
  const out=[];while(out.length<3&&pool.length){const i=pool[Math.floor(Math.random()*pool.length)];out.push(i);for(let k=pool.length-1;k>=0;k--)if(pool[k]===i)pool.splice(k,1);}
  return out;
}
function applyPick(p,i){
  if(!p.offer||i<0||i>=p.offer.length)return;
  const c=p.offer[i];p.st[c]++;recalc(p);
  if(c===9)p.hp=p.maxhp;
  if(c===10)G.core.hp=Math.min(G.core.max,G.core.hp+30);
  p.picks--;p.offer=null;G.ev.push([12,Math.round(p.x),Math.round(p.y),p.hue]);
}
function onHostMsg(m){
  if(!G||!m)return;
  if(m.t==='hello'){
    let p=G.pl.find(q=>q.id===m.id);
    if(!p){if(G.pl.length>=MAXP){net.send({t:'full',to:m.id});return;}p=addPlayer(m.id,String(m.name||'Wąż').slice(0,12));}
  }else if(m.t==='in'){
    const p=G.pl.find(q=>q.id===m.id);if(!p)return;
    p.last=performance.now();
    if(!p.down){p.x=clamp(+m.x||p.x,20,W-20);p.y=clamp(+m.y||p.y,20,H-20);}
    p.a=+m.a||0;p.f=!!m.f;p.ps=m.ps|0;
  }else if(m.t==='pick'){
    const p=G.pl.find(q=>q.id===m.id);if(p)applyPick(p,m.i|0);
  }else if(m.t==='bye'){G.pl=G.pl.filter(q=>q.id!==m.id);}
}

/* ---------- HOST: wrogowie ---------- */
function progress(g){let c=g.budget;for(const e of g.en)c+=ED[e.type].cost;if(g.bossPending)c+=10;return g.ph==='wave'?1-c/Math.max(1,g.bTotal):(g.wave?1:0);}
function mkEnemy(type,x,y){
  const g=G,w=g.wave,np=g.pl.length,d=ED[type];
  let hp=d.hp*(1+w*.06)*(1+.3*(np-1));
  if(type===7)hp=(d.hp+w*14)*(1+.6*(np-1));
  hp=Math.ceil(hp);
  const e={id:g.nid++,type,x,y,vx:0,vy:0,hp,max:hp,r:d.r,sp:d.sp*(1+Math.min(.5,w*.02))*rnd(.92,1.08),dmg:d.dmg,a:0,fl:0,st:0,tm:rnd(.8,2.2),tm2:rnd(2,5),
    off:rnd(0,TAU),dir:Math.random()<.5?1:-1,aggro:Math.random()<.45,tgt:null,tgtT:0,oang:rnd(0,TAU),ocd:0};
  g.en.push(e);return e;
}
function spawnGroup(){
  const g=G,w=g.wave;
  const defs=[[0,10,1],[1,5,2],[6,3,3],[3,3,4],[4,3,4],[2,2,5]];
  const ok=defs.filter(d=>w>=d[2]&&ED[d[0]].cost<=g.budget);
  let tot=0;for(const d of ok)tot+=d[1];let r=Math.random()*tot,type=0;
  for(const d of ok){r-=d[1];if(r<=0){type=d[0];break;}}
  let n=type===0?rint(4,7)+Math.floor(w/3):type===1?rint(1,2+(w>6?1:0)):type===2?1:rint(1,2);
  n=Math.max(1,Math.min(n,Math.floor(g.budget/Math.max(1,ED[type].cost))));
  const th=rnd(0,TAU),bx=CX+Math.cos(th)*1130,by=CY+Math.sin(th)*650;
  for(let i=0;i<n;i++){
    const ox=-Math.sin(th)*(i-(n-1)/2)*34+rnd(-18,18),oy=Math.cos(th)*(i-(n-1)/2)*34+rnd(-18,18);
    mkEnemy(type,clamp(bx+ox,-20,W+20),clamp(by+oy,-20,H+20));
  }
  g.budget-=n*ED[type].cost;
}
function startWave(){
  const g=G,np=g.pl.length;g.wave++;g.ph='wave';
  const boss=g.wave%5===0;
  g.budget=Math.round((8+g.wave*4.6)*(1+.35*(np-1))*(boss?.5:1));g.bTotal=g.budget+(boss?10:0);g.bossPending=boss;g.spawnCd=.8;
  g.ev.push([boss?16:7,g.wave]);
}
function dropSparks(x,y,n){for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(40,170);G.sp.push({id:G.nid++,x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:18});}}
function levelCheck(p){
  while(p.sp>=cumXP(p.lvl)){p.lvl++;p.picks++;G.ev.push([9,Math.round(p.x),Math.round(p.y),p.lvl,p.hue]);}
}
function killEnemy(e,ownerId){
  if(e.dead)return;e.dead=true;const g=G;
  g.ev.push([1,Math.round(e.x),Math.round(e.y),e.type]);
  dropSparks(e.x,e.y,ED[e.type].drop);
  if(e.type===4){for(let i=0;i<3;i++){const s=mkEnemy(5,e.x+rnd(-12,12),e.y+rnd(-12,12));s.vx=rnd(-120,120);s.vy=rnd(-120,120);}}
  if(e.type===7){for(const p of g.pl)p.picks++;g.ev.push([17]);}
  const o=g.pl.find(p=>p.id===ownerId);if(o)o.score+=e.type===7?500:e.type===2?50:10;
}
function hurtPlayer(p,dmg){
  p.hp-=dmg;p.inv=1;G.ev.push([6,Math.round(p.x),Math.round(p.y)]);
  if(p.hp<=0){p.hp=0;p.down=true;p.rv=0;p.f=false;G.ev.push([11,Math.round(p.x),Math.round(p.y)]);}
}
function nearestAlive(g,x,y,maxD){let b=null,bd=maxD||1e9;for(const p of g.pl){if(p.down)continue;const d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;b=p;}}return b;}
function steer(e,tx,ty,spd,dt,weave){
  const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy)||1;
  let ux=dx/d,uy=dy/d;
  if(weave){const w=Math.sin(G.time*2.2+e.off)*weave;const nx=-uy,ny=ux;ux+=nx*w;uy+=ny*w;const l=Math.hypot(ux,uy)||1;ux/=l;uy/=l;}
  const k=Math.min(1,dt*4);e.vx+=(ux*spd-e.vx)*k;e.vy+=(uy*spd-e.vy)*k;
  e.a=Math.atan2(e.vy,e.vx);
}
function enemyShoot(e,tx,ty,spd,dmg,fan){
  const base=Math.atan2(ty-e.y,tx-e.x);
  for(let i=0;i<fan;i++){const a=base+(i-(fan-1)/2)*.22;
    G.eb.push({id:G.nid++,x:e.x+Math.cos(a)*e.r,y:e.y+Math.sin(a)*e.r,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:5,dmg});}
  G.ev.push([13,Math.round(e.x),Math.round(e.y)]);
}
function radial(e,n,spd,off){for(let i=0;i<n;i++){const a=off+i/n*TAU;G.eb.push({id:G.nid++,x:e.x+Math.cos(a)*e.r*.8,y:e.y+Math.sin(a)*e.r*.8,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:6,dmg:12});}G.ev.push([13,Math.round(e.x),Math.round(e.y)]);}

function enemyAI(e,dt){
  const g=G,alive=g.pl.filter(p=>!p.down);
  e.tgtT-=dt;e.tm-=dt;
  switch(e.type){
    case 0:{ // meduza — rój, część goni graczy, reszta rdzeń; kołysze się na boki
      let t=null;if(e.aggro)t=nearestAlive(g,e.x,e.y,650);
      steer(e,t?t.x:CX,t?t.y:CY,e.sp,dt,.7);break;}
    case 1:{ // kłapacz — wyprowadza szarże
      const t=nearestAlive(g,e.x,e.y)||{x:CX,y:CY};
      if(e.st===0){steer(e,t.x,t.y,e.sp,dt,.35);
        if(e.tm<=0&&Math.hypot(t.x-e.x,t.y-e.y)<360){e.st=1;e.tm=.5;e.a=Math.atan2(t.y-e.y,t.x-e.x);}}
      else if(e.st===1){e.vx*=.8;e.vy*=.8;if(e.tm<=0){e.st=2;e.tm=.4;e.vx=Math.cos(e.a)*520;e.vy=Math.sin(e.a)*520;}}
      else{if(e.tm<=0){e.st=0;e.tm=rnd(1.4,2.4);}}
      break;}
    case 2:{ // jeżowiec — wolny pancerniak, wścieka się przy połowie HP
      if(e.hp<e.max*.5&&e.st!==3){e.st=3;e.sp*=1.7;}
      steer(e,CX,CY,e.sp,dt,.1);break;}
    case 3:{ // pluj — trzyma dystans, krąży, strzela
      if(e.tgtT<=0){e.tgtT=3.5;e.tgt=(alive.length&&Math.random()<.7)?alive[rint(0,alive.length-1)].id:'core';}
      let t=e.tgt==='core'?{x:CX,y:CY}:g.pl.find(p=>p.id===e.tgt&&!p.down);if(!t){t={x:CX,y:CY};e.tgt='core';}
      const dx=t.x-e.x,dy=t.y-e.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;
      let mx=-uy*e.dir,my=ux*e.dir;
      if(d>340){mx+=ux*1.2;my+=uy*1.2;}else if(d<250){mx-=ux*1.2;my-=uy*1.2;}
      const l=Math.hypot(mx,my)||1,k=Math.min(1,dt*3);
      e.vx+=(mx/l*e.sp-e.vx)*k;e.vy+=(my/l*e.sp-e.vy)*k;
      if(e.st===0&&e.tm<=0){e.st=1;e.tm=.55;}
      else if(e.st===1){e.a=Math.atan2(dy,dx);if(e.tm<=0){enemyShoot(e,t.x,t.y,240,10,g.wave>=8?3:1);e.st=0;e.tm=rnd(2,3);}}
      if(e.st===0)e.a=Math.atan2(dy,dx);
      break;}
    case 4:steer(e,CX,CY,e.sp,dt,.25);break;
    case 5:{const t=nearestAlive(g,e.x,e.y,500);steer(e,t?t.x:CX,t?t.y:CY,e.sp,dt,.5);break;}
    case 6:{ // pijawka — przyczepia się do Serca i wysysa
      if(e.st===2){e.oang+=dt*.9;const rr=CORE_R+16;e.x=CX+Math.cos(e.oang)*rr;e.y=CY+Math.sin(e.oang)*rr;e.a=e.oang+Math.PI;e.vx=e.vy=0;g.core.hp-=3*dt;if(Math.random()<dt*2)g.ev.push([5,Math.round(e.x),Math.round(e.y),1]);}
      else{steer(e,CX,CY,e.sp,dt,.5);if(Math.hypot(e.x-CX,e.y-CY)<CORE_R+e.r+22){e.st=2;e.oang=Math.atan2(e.y-CY,e.x-CX);}}
      break;}
    case 7:{ // boss
      const enr=e.hp<e.max*.5;if(enr&&e.st!==3)e.st=3;
      if(e.st===2){e.x+=(CX+Math.cos(e.oang)*(CORE_R+e.r*.7)-e.x)*dt*3;e.y+=(CY+Math.sin(e.oang)*(CORE_R+e.r*.7)-e.y)*dt*3;g.core.hp-=14*dt;
        if(Math.random()<dt*3)g.ev.push([5,Math.round(CX+rnd(-30,30)),Math.round(CY+rnd(-30,30)),1]);}
      else{steer(e,CX,CY,e.sp*(enr?1.5:1),dt,0);if(Math.hypot(e.x-CX,e.y-CY)<CORE_R+e.r*.9){e.st=2;e.oang=Math.atan2(e.y-CY,e.x-CX);}}
      const tgt=nearestAlive(g,e.x,e.y);if(tgt&&e.st!==2)e.a=Math.atan2(tgt.y-e.y,tgt.x-e.x);
      e.tm2-=dt;
      if(e.tm<=0){radial(e,enr?18:12,enr?210:170,rnd(0,TAU));e.tm=enr?2.2:3.4;}
      if(e.tm2<=0){for(let i=0;i<4;i++)mkEnemy(0,e.x+rnd(-60,60),e.y+rnd(-60,60));e.tm2=enr?6:9;}
      break;}
  }
}

function shoot(p){
  const u=p.u,n=u.n,spread=n>1?(n===2?.1:.12):0;p.fcd=Math.max(.07,.3/u.rate);
  for(let i=0;i<n;i++){const a=p.a+(i-(n-1)/2)*spread;
    G.bu.push({id:G.nid++,x:p.x+Math.cos(p.a)*16,y:p.y+Math.sin(p.a)*16,vx:Math.cos(a)*820,vy:Math.sin(a)*820,life:1.0,hue:p.hue,own:p.id,dmg:u.dmg,pierce:u.pierce,home:u.home,hit:[],r:4+u.dmg*.9});}
}
function pulse(p){
  const R=p.u.pR;p.pcd=PULSE_CD*p.u.pcdM;G.ev.push([4,Math.round(p.x),Math.round(p.y),p.hue,Math.round(R)]);
  for(const e of G.en){const dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy);
    if(d<R+e.r){e.hp-=4+p.u.dmg-1;const k=(e.type===2||e.type===7?25:90)/(d||1);if(e.st!==2||e.type!==6){e.x+=dx*k;e.y+=dy*k;}if(e.type===6&&e.st===2){e.st=0;}if(e.hp<=0)killEnemy(e,p.id);}}
  for(const b of G.eb)if(Math.hypot(b.x-p.x,b.y-p.y)<R)b.life=0;
}

function hostStep(dt){
  const g=G;g.time+=dt;
  const hp0=g.pl.find(p=>p.id===me.id);
  if(hp0){hp0.last=performance.now();if(!hp0.down){hp0.x=me.x;hp0.y=me.y;}hp0.a=me.a;hp0.f=me.f;hp0.ps=me.ps;}
  const now=performance.now();
  g.pl=g.pl.filter(p=>p.id===me.id||now-p.last<7000);
  if(g.ph==='over')return;
  const alive=g.pl.filter(p=>!p.down);
  // gracze
  for(const p of g.pl){
    p.inv=Math.max(0,p.inv-dt);p.fcd-=dt;p.pcd=Math.max(0,p.pcd-dt);p.ocd=Math.max(0,p.ocd-dt);
    p.pc=p.pcd/(PULSE_CD*p.u.pcdM);
    if(p.ps!==p.psDone){p.psDone=p.ps;if(p.pcd<=0&&!p.down)pulse(p);}
    if(p.down){
      const near=g.pl.some(q=>!q.down&&Math.hypot(q.x-p.x,q.y-p.y)<75);
      p.rv=clamp(p.rv+(near?dt:-dt*.5),0,2.5);
      if(p.rv>=2.5){p.down=false;p.hp=p.maxhp*.5;p.inv=2;p.rv=0;g.ev.push([8,Math.round(p.x),Math.round(p.y)]);}
    }else{
      if(p.f&&p.fcd<=0)shoot(p);
      if(p.hp<p.maxhp)p.hp=Math.min(p.maxhp,p.hp+dt*.6);
    }
  }
  // pociski gracza
  for(const b of g.bu){
    if(b.home>0){let t=null,bd=320;for(const e of g.en){if(b.hit.includes(e.id))continue;const d=Math.hypot(e.x-b.x,e.y-b.y);if(d<bd){bd=d;t=e;}}
      if(t){const sp=Math.hypot(b.vx,b.vy);let da=Math.atan2(t.y-b.y,t.x-b.x)-Math.atan2(b.vy,b.vx);while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;
        const na=Math.atan2(b.vy,b.vx)+clamp(da,-b.home*3.4*dt,b.home*3.4*dt);b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp;}}
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.x<-40||b.x>W+40||b.y<-40||b.y>H+40)b.life=0;
    if(b.life<=0)continue;
    for(const x of g.eb){if(x.life>0&&Math.hypot(x.x-b.x,x.y-b.y)<b.r+8){x.life=0;if(b.pierce>0)b.pierce--;else b.life=0;g.ev.push([2,Math.round(x.x),Math.round(x.y)]);break;}}
    if(b.life<=0)continue;
    for(const e of g.en){if(e.dead||b.hit.includes(e.id))continue;const dx=e.x-b.x,dy=e.y-b.y,r=e.r+b.r;
      if(dx*dx+dy*dy<r*r){e.hp-=b.dmg;e.fl=.1;g.ev.push([2,Math.round(b.x),Math.round(b.y)]);
        if(b.pierce>0){b.pierce--;b.hit.push(e.id);}else b.life=0;
        if(e.hp<=0)killEnemy(e,b.own);break;}}
  }
  g.bu=g.bu.filter(b=>b.life>0);
  // światełka orbitujące
  for(const p of g.pl){if(p.down||!p.orb)continue;
    for(let k=0;k<p.orb;k++){const a=g.time*3.2+k*TAU/p.orb,ox=p.x+Math.cos(a)*58,oy=p.y+Math.sin(a)*58;
      for(const e of g.en){if(e.dead)continue;if(Math.hypot(e.x-ox,e.y-oy)<e.r+11){if((e.ocd||0)<=0){e.hp-=p.u.dmg;e.ocd=.3;g.ev.push([2,Math.round(ox),Math.round(oy)]);if(e.hp<=0)killEnemy(e,p.id);}}}
      for(const x of g.eb)if(x.life>0&&Math.hypot(x.x-ox,x.y-oy)<20)x.life=0;}}
  // wrogowie
  for(const e of g.en){
    if(e.dead)continue;
    e.ocd=Math.max(0,(e.ocd||0)-dt);
    enemyAI(e,dt);
    if(e.st!==2||e.type===1){e.x+=e.vx*dt;e.y+=e.vy*dt;}
    if(e.type!==6&&e.type!==7){
      if(Math.hypot(e.x-CX,e.y-CY)<CORE_R+e.r*.6){g.core.hp-=e.dmg;e.dead=true;g.ev.push([5,Math.round(e.x),Math.round(e.y)]);continue;}
    }
    if(e.type===6&&e.st===2)continue;
    for(const p of alive){
      if(p.down||p.inv>0)continue;
      if(Math.hypot(p.x-e.x,p.y-e.y)<e.r+11){hurtPlayer(p,e.dmg||8);if(e.type!==2&&e.type!==7)e.dead=true;break;}
    }
  }
  // rozpychanie
  const E=g.en;
  for(let i=0;i<E.length;i++){const a=E[i];if(a.dead||(a.type===6&&a.st===2)||a.type===7)continue;
    for(let j=i+1;j<E.length;j++){const b=E[j];if(b.dead||(b.type===6&&b.st===2)||b.type===7)continue;const dx=b.x-a.x,dy=b.y-a.y,m=a.r+b.r,d2=dx*dx+dy*dy;
      if(d2<m*m&&d2>.01){const d=Math.sqrt(d2),k=(m-d)*.5/d;a.x-=dx*k;a.y-=dy*k;b.x+=dx*k;b.y+=dy*k;}}}
  g.en=E.filter(e=>!e.dead);
  // pociski wrogów
  for(const b of g.eb){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.x<-60||b.x>W+60||b.y<-60||b.y>H+60)b.life=0;
    if(b.life<=0)continue;
    if(Math.hypot(b.x-CX,b.y-CY)<CORE_R+4){g.core.hp-=6;b.life=0;g.ev.push([5,Math.round(b.x),Math.round(b.y)]);continue;}
    for(const p of alive){if(!p.down&&p.inv<=0&&Math.hypot(p.x-b.x,p.y-b.y)<18){hurtPlayer(p,b.dmg);b.life=0;break;}}
  }
  g.eb=g.eb.filter(b=>b.life>0);
  // iskry
  for(const s of g.sp){
    s.life-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;const dr=Math.pow(.05,dt);s.vx*=dr;s.vy*=dr;
    let tgt=null,bd=0;for(const p of alive){const d=Math.hypot(p.x-s.x,p.y-s.y),rng=150*p.u.mag;if(d<rng&&(!tgt||d<bd)){bd=d;tgt=p;}}
    if(tgt){const dx=tgt.x-s.x,dy=tgt.y-s.y,d=Math.hypot(dx,dy)||1,v=440;s.x+=dx/d*v*dt;s.y+=dy/d*v*dt;
      if(d<26){s.life=0;tgt.sp++;tgt.score++;g.ev.push([3,Math.round(s.x),Math.round(s.y)]);levelCheck(tgt);}}
  }
  g.sp=g.sp.filter(s=>s.life>0);
  // fale
  if(g.ph==='break'){
    let pend=false;
    for(const p of g.pl){
      if(p.picks>0&&!p.offer){p.offer=makeOffer(p);p.pickT=18;}
      if(p.offer){pend=true;p.pickT-=dt;if(p.pickT<=0)applyPick(p,rint(0,p.offer.length-1));}
    }
    if(!pend){g.wt-=dt;if(g.wt<=0)startWave();}
  }else if(g.ph==='wave'){
    g.spawnCd-=dt;
    if(g.spawnCd<=0&&g.en.length<70&&(g.budget>0||g.bossPending)){
      if(g.bossPending){const a=rnd(0,TAU);mkEnemy(7,clamp(CX+Math.cos(a)*1100,0,W),clamp(CY+Math.sin(a)*640,0,H));g.bossPending=false;g.spawnCd=4;}
      else{spawnGroup();g.spawnCd=Math.max(.9,3.4-g.wave*.13);}
    }
    if(g.budget<=0&&!g.bossPending&&g.en.length===0){
      g.ph='break';g.wt=5;g.core.hp=Math.min(g.core.max,g.core.hp+15);g.eb=[];
      for(const p of g.pl){p.picks++;if(p.down){p.down=false;p.hp=p.maxhp*.5;p.inv=2;p.rv=0;g.ev.push([8,Math.round(p.x),Math.round(p.y)]);}else p.hp=Math.min(p.maxhp,p.hp+30);}
      g.ev.push([18,g.wave]);
    }
  }
  if(g.core.hp<=0||(g.pl.length&&g.pl.every(p=>p.down))){g.core.hp=Math.max(0,g.core.hp);g.ph='over';g.ev.push([10]);}
}
function broadcast(){
  const g=G;if(g.pl.length<2)return;
  const r=Math.round;
  net.send({t:'st',rn:g.rn,w:g.wave,ph:g.ph,ch:r(g.core.hp),cm:g.core.max,wt:+g.wt.toFixed(1),pr:+progress(g).toFixed(2),

function syncMap(map,arr,mk){
  const seen=new Set();
  for(const a of arr){let o=map.get(a[0]);const fresh=!o;if(fresh)o={id:a[0]};mk(o,a,fresh);if(fresh){o.x=o.tx;o.y=o.ty;map.set(a[0],o);}seen.add(a[0]);}
  for(const k of Array.from(map.keys()))if(!seen.has(k))map.delete(k);
}
function onClientMsg(m){
  if(!m)return;
  if(m.t==='full'&&m.to===me.id&&!joined){toast('Pokój jest pełny (max '+MAXP+')');leave(true);return;}
  if(m.t!=='st')return;
  cv.lastSnap=performance.now();
  cv.wave=m.w;cv.ph=m.ph;cv.core.hp=m.ch;cv.core.max=m.cm;cv.wt=m.wt;cv.pr=m.pr;
  syncMap(cv.pm,m.p,(o,a,fresh)=>{o.name=a[1];o.hue=a[2];o.tx=a[3];o.ty=a[4];o.ta=a[5];if(fresh)o.a=o.ta;

    o.hp=a[6];o.down=!!a[7];o.rv=a[8];o.sp=a[9];o.score=a[10];o.pc=a[11];o.picks=a[12];o.offer=a[13]||null;o.orb=a[14];o.maxhp=a[15];o.lvl=a[16];o.spd=a[17];});
  syncMap(cv.em,m.e,(o,a,fresh)=>{o.type=a[1];o.tx=a[2];o.ty=a[3];if(!fresh&&a[4]<o.hp)o.fl=.1;o.hp=a[4];o.max=a[5];o.st=a[6];o.ta=a[7]/10;o.r=ED[o.type].r;if(fresh){o.a=o.ta;o.fl=0;}});
  syncMap(cv.bm,m.b,(o,a)=>{o.tx=a[1];o.ty=a[2];o.hue=a[3];o.r=a[4];});
  syncMap(cv.sm,m.s,(o,a)=>{o.tx=a[1];o.ty=a[2];});
  syncMap(cv.xm,m.x,(o,a)=>{o.tx=a[1];o.ty=a[2];});
  cv.players=Array.from(cv.pm.values());cv.enemies=Array.from(cv.em.values());cv.bullets=Array.from(cv.bm.values());cv.sparks=Array.from(cv.sm.values());cv.ebul=Array.from(cv.xm.values());
  const mp=cv.pm.get(me.id);
  if(mp&&!joined){joined=true;me.x=mp.tx;me.y=mp.ty;enterGame();toast('Dołączono do pokoju '+roomCode);}
  if(mp&&m.rn!==cv.rn){me.x=mp.tx;me.y=mp.ty;me.vx=me.vy=0;if(mp.trail)mp.trail.length=0;}
  cv.rn=m.rn;
  processEvents(m.ev);
}
function angLerp(a,b,k){let d=b-a;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return a+d*k;}
function easeClient(dt){
  const k=1-Math.exp(-dt*16);
  for(const map of [cv.pm,cv.em,cv.bm,cv.sm,cv.xm])for(const o of map.values()){
    if(o.id===me.id&&map===cv.pm)continue;

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function bodyPoints(p,n,sp){
  const tr=p.trail;const out=[{x:p.x,y:p.y}];let px=p.x,py=p.y,need=sp;
  for(let i=tr.length-1;i>=0&&out.length<n;i--){const q=tr[i];let dx=q.x-px,dy=q.y-py,d=Math.hypot(dx,dy);
    while(d>=need&&out.length<n){const k=need/d;px+=dx*k;py+=dy*k;out.push({x:px,y:py});dx=q.x-px;dy=q.y-py;d=Math.hypot(dx,dy);need=sp;}
    need-=d;px=q.x;py=q.y;}
  while(out.length<n){const l=out[out.length-1];out.push({x:l.x,y:l.y});}
  return out;
}
function drawPlayer(p,isMe,dt){
  const tr=p.trail||(p.trail=[]);

  const mv=clamp(p.spd2/160,0,1);
  const N=22+Math.min(p.lvl||0,10)*2,pts=bodyPoints(p,N,5.2),h=p.hue,dim=p.down?.35:1;
  ctx.globalCompositeOperation='lighter';

  ctx.globalAlpha=dim;ctx.fillStyle=`hsl(${h},100%,${p.down?45:84}%)`;ctx.beginPath();ctx.arc(p.x,p.y,12.5,0,TAU);ctx.fill();

    ctx.globalAlpha=.55;ctx.strokeStyle=`hsl(${h+150},100%,75%)`;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(p.x+bx*10,p.y+by*10);ctx.quadraticCurveTo(p.x+bx*22-by*8,p.y+by*22+bx*8,lx,ly);ctx.stroke();

    ctx.globalCompositeOperation='source-over';}

    ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(p.x,p.y,28,0,TAU);ctx.stroke();
    ctx.strokeStyle='#5dff9a';ctx.beginPath();ctx.arc(p.x,p.y,28,-Math.PI/2,-Math.PI/2+TAU*p.rv/2.5);ctx.stroke();

function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-(frame.l||now))/1000);frame.l=now;T+=dt;
  if(inGame)localUpdate(dt);
  if(!isHost&&inGame)easeClient(dt);
  const R=view();
  // kamera
  const vw=VW/SC,vh=VH/SC;
  let tx=me.x-vw/2,ty=me.y-vh/2;
  tx=W>vw?clamp(tx,0,W-vw):(W-vw)/2;ty=H>vh?clamp(ty,0,H-vh):(H-vh)/2;
  if(!inGame){tx=CX-vw/2+Math.sin(T*.1)*60;ty=CY-vh/2+Math.cos(T*.13)*40;}
  if(!cam.init){cam.x=tx;cam.y=ty;cam.init=true;}
  const ck=1-Math.exp(-dt*7);cam.x+=(tx-cam.x)*ck;cam.y+=(ty-cam.y)*ck;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#01040a';ctx.fillRect(0,0,VW,VH);
  shake=Math.max(0,shake-dt*22);
  const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;
  ctx.setTransform(DPR*SC,0,0,DPR*SC,DPR*(-cam.x*SC+sx),DPR*(-cam.y*SC+sy));
  ctx.drawImage(BG,0,0,W,H);
  // promienie światła
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<7;i++){const x=cam.x+(i/6)*vw*1.2-vw*.1+Math.sin(T*.2+i*2)*90-cam.x*.0,w=60+30*Math.sin(T*.3+i);
    const g=ctx.createLinearGradient(0,cam.y,0,cam.y+vh);g.addColorStop(0,'rgba(90,190,230,.07)');g.addColorStop(1,'rgba(90,190,230,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-w,cam.y);ctx.lineTo(x+w,cam.y);ctx.lineTo(x+w*3+Math.sin(T*.15+i)*80,cam.y+vh);ctx.lineTo(x-w*3+Math.sin(T*.15+i)*80,cam.y+vh);ctx.closePath();ctx.fill();}
  // morski śnieg (paralaksa)
  ctx.fillStyle='#9fe8ff';
  for(const s of snow){s.y-=dt*(.006+s.z*.012);s.x+=Math.sin(T*.5+s.p)*dt*.004;if(s.y<0)s.y+=1;
    const px=(((s.x*vw*1.6-cam.x*s.z*.5)%vw)+vw)%vw+cam.x,py=((s.y*vh*1.6)%vh+vh)%vh+cam.y;
    ctx.globalAlpha=.15+.4*s.z;ctx.fillRect(px,py,1.2+s.z*2.4,1.2+s.z*2.4);}
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  drawCore(R.core,T);
  // iskry
  ctx.globalCompositeOperation='lighter';
  for(const s of R.sparks){const b=Math.sin(T*6+s.id)*2;dg(s.x,s.y,15+b,55,.9,60);ctx.globalAlpha=1;ctx.fillStyle='#fff7c2';ctx.beginPath();ctx.arc(s.x,s.y,2.6,0,TAU);ctx.fill();}
  // pociski wrogów
  for(const b of R.ebul){dg(b.x,b.y,22,325,.9,50);ctx.globalAlpha=1;ctx.fillStyle='#ffd0f0';ctx.beginPath();ctx.arc(b.x,b.y,4,0,TAU);ctx.fill();}
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  for(const e of R.enemies){if(e.fl>0)e.fl-=dt;drawEnemy(e);}
  ctx.globalCompositeOperation='lighter';
  for(const b of R.bullets){const r=b.r||4;dg(b.x,b.y,r*5,b.hue,.9,60);ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,r*.6,0,TAU);ctx.fill();}
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  for(const p of R.players){
    if(p.id===me.id){p.x=me.x;p.y=me.y;p.a=me.a;}
    if(p.fl>0)p.fl-=dt;
    drawPlayer(p,p.id===me.id,dt);
  }
  ctx.globalCompositeOperation='lighter';
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.l-=dt;if(q.l<=0){parts.splice(i,1);continue;}
    q.x+=q.vx*dt;q.y+=q.vy*dt;const d=Math.pow(.04,dt);q.vx*=d;q.vy*=d;dg(q.x,q.y,q.s*(.4+q.l/q.m),q.h,clamp(q.l/q.m,0,1),58);}

  ctx.globalCompositeOperation='source-over';
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.l-=dt;if(f.l<=0){floats.splice(i,1);continue;}f.y-=dt*28;

  if(inGame&&!isHost&&joined&&performance.now()-cv.lastSnap>5000){toast('Host opuścił grę');leave(true);}
}

function wrap(txt,maxW){const words=txt.split(' '),lines=[];let l='';for(const w of words){const t=l?l+' '+w:w;if(ctx.measureText(t).width>maxW&&l){lines.push(l);l=w;}else l=t;}if(l)lines.push(l);return lines;}

function tryPickAt(x,y){

    const cx=VW/2,cy=VH/2,dx=sx-cx,dy=sy-cy,k=Math.min((VW/2-m)/Math.abs(dx||1e-6),(VH/2-m)/Math.abs(dy||1e-6)),ax=cx+dx*k,ay=cy+dy*k,a=Math.atan2(dy,dx);

  const sm=VW<700||VH<420;
  ctx.textBaseline='alphabetic';
  if(IS_TOUCH&&VH>VW){ctx.fillStyle='rgba(1,4,10,.82)';ctx.fillRect(0,VH*.35,VW,VH*.3);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='700 22px Rajdhani,sans-serif';
    ctx.fillText('Obróć telefon poziomo ↻',VW/2,VH*.5);ctx.font=f(15);ctx.fillStyle='#8cc';ctx.fillText('(wyłącz blokadę obrotu ekranu)',VW/2,VH*.5+26);}
  // Serce Rafy
  const bw=Math.min(380,VW<900?VW*.3:VW-40),bx=(VW-bw)/2;
  ctx.textAlign='center';ctx.fillStyle='#ffd978';ctx.font='700 12px Rajdhani,sans-serif';ctx.fillText('SERCE RAFY',VW/2,16);
  ctx.fillStyle='rgba(255,255,255,.12)';rr(bx,20,bw,10,5);ctx.fill();
  const cf=clamp(R.core.hp/R.core.max,0,1);ctx.fillStyle=`hsl(${cf*120},90%,55%)`;if(cf>0){rr(bx,20,Math.max(8,bw*cf),10,5);ctx.fill();}
  // boss
  const boss=R.enemies.find(e=>e.type===7);
  if(boss){ctx.fillStyle='#ff6a7a';ctx.font='800 12px Orbitron,sans-serif';ctx.fillText('LEWIATAN',VW/2,48);
    ctx.fillStyle='rgba(255,255,255,.12)';rr(bx,53,bw,9,4);ctx.fill();ctx.fillStyle='#ff3a4a';rr(bx,53,Math.max(6,bw*clamp(boss.hp/boss.max,0,1)),9,4);ctx.fill();}
  // fala + postęp
  const pw=sm?120:150;panel(8,8,pw,sm?46:54);
  ctx.textAlign='left';ctx.fillStyle='#e8fbff';ctx.font='900 '+(sm?17:20)+'px Orbitron,sans-serif';ctx.fillText('FALA '+Math.max(1,R.wave),18,sm?29:33);
  ctx.fillStyle='rgba(255,255,255,.12)';rr(18,sm?36:42,pw-20,6,3);ctx.fill();ctx.fillStyle='#2ef2ff';if(R.pr>0){rr(18,sm?36:42,Math.max(5,(pw-20)*clamp(R.pr,0,1)),6,3);ctx.fill();}
  // gracze
  let y=sm?62:70;
  for(const p of R.players){
    const mh=p.maxhp||100;panel(8,y,pw+30,sm?30:36,p.id===me.id?`hsla(${p.hue},100%,65%,.55)`:undefined);
    ctx.fillStyle=`hsl(${p.hue},100%,65%)`;ctx.beginPath();ctx.arc(20,y+(sm?11:13),5,0,TAU);ctx.fill();
    ctx.fillStyle=p.down?'#7a8f99':'#d8f6ff';ctx.font=f(sm?13:15);ctx.fillText(p.name,31,y+(sm?15:17));
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(18,y+(sm?21:25),pw+8,4);ctx.fillStyle=p.down?'#556':`hsl(${p.hp/mh*120},90%,55%)`;ctx.fillRect(18,y+(sm?21:25),(pw+8)*p.hp/mh,4);
    ctx.textAlign='right';ctx.fillStyle=`hsl(${p.hue},100%,75%)`;ctx.font=f(12);ctx.fillText('Lv'+((p.lvl||0)+1),pw+30,y+(sm?15:17));ctx.textAlign='left';
    y+=sm?34:41;
  }
  drawRadar(R);
  const mp=R.players.find(p=>p.id===me.id);
  const cd=mp?mp.pc:0;
  // pasek doświadczenia
  if(mp){const lv=mp.lvl||0,prev=lv?cumXP(lv-1):0,fr=clamp((mp.sp-prev)/(cumXP(lv)-prev),0,1);
    ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(0,VH-5,VW,5);ctx.fillStyle='#ffc94a';ctx.fillRect(0,VH-5,VW*fr,5);}
  if(!IS_TOUCH){
    const pw2=Math.min(220,VW-40),px=(VW-pw2)/2,py=VH-30;
    ctx.fillStyle='rgba(255,255,255,.12)';rr(px,py,pw2,8,4);ctx.fill();
    ctx.fillStyle=cd<=0?'#5dffe6':'#2a7a8a';rr(px,py,Math.max(8,pw2*(1-clamp(cd,0,1))),8,4);ctx.fill();
    ctx.textAlign='center';ctx.font=f(14);ctx.fillStyle=cd<=0?'#9ff':'#6f9bb0';ctx.fillText(cd<=0?'PULS GOTOWY — SPACJA':'puls się ładuje…',VW/2,py-6);
  }else drawTouchUI(cd,mp);
  if(R.wave<=1&&R.ph==='break'&&R.players.length<2){ctx.textAlign='center';ctx.fillStyle='#9fd';ctx.font=f(17);ctx.fillText('Wyślij kod pokoju znajomym — '+roomCode,VW/2,VH*.2);}
  // przerwa
  if(R.ph==='break'&&R.wave>0){ctx.textAlign='center';ctx.fillStyle='#7fd0e8';ctx.font=f(16);
    const wait=R.players.some(p=>p.offer);ctx.fillText(wait?'Wybierz ulepszenie — następna fala zaczeka':'Następna fala za '+Math.ceil(R.wt)+'s',VW/2,VH*.28);}
  drawCards(mp);
  // baner
  if(banner&&R.ph==='over'&&banner.m>50)banner=null;
  if(banner){banner.l-=dt;if(banner.l<=0)banner=null;else{
    const a=banner.m>50?1:clamp(Math.min(banner.l,banner.m-banner.l)*2.5,0,1);
    ctx.globalAlpha=a;ctx.textAlign='center';ctx.font='900 '+Math.min(72,VW/9)+'px Orbitron,sans-serif';
    ctx.shadowColor=banner.red?'#ff2a4a':'#2ef2ff';ctx.shadowBlur=30;ctx.fillStyle='#fff';ctx.fillText(banner.txt,VW/2,VH*.4);
    if(banner.sub){ctx.font='800 '+Math.min(30,VW/22)+'px Orbitron,sans-serif';ctx.fillStyle='#ff5a6a';ctx.fillText(banner.sub,VW/2,VH*.4+Math.min(44,VW/16));}
    ctx.shadowBlur=0;ctx.globalAlpha=1;}}
  if(R.ph==='over'){
    ctx.fillStyle='rgba(1,4,10,.6)';ctx.fillRect(0,0,VW,VH);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='900 '+Math.min(60,VW/10)+'px Orbitron,sans-serif';ctx.shadowColor='#ff3fd0';ctx.shadowBlur=26;
    ctx.fillText('RAFA ZGASŁA',VW/2,VH*.34);ctx.shadowBlur=0;
    ctx.font=f(24);ctx.fillStyle='#ffd978';ctx.fillText('Dotrwaliście do fali '+Math.max(1,R.wave),VW/2,VH*.34+38);
    const sorted=[...R.players].sort((a,b)=>b.score-a.score);ctx.font=f(20);
    sorted.forEach((p,i)=>{ctx.fillStyle=`hsl(${p.hue},100%,75%)`;ctx.fillText(`${i+1}. ${p.name} — ${p.score} pkt`,VW/2,VH*.34+72+i*26);});
    ctx.fillStyle='#9ff';ctx.font=f(20);ctx.fillText(isHost?(tc.usedTouch?'Dotknij ekranu — zagraj ponownie':'ENTER lub kliknięcie — zagraj ponownie'):'Czekaj, aż host zacznie nową grę…',VW/2,VH*.34+72+sorted.length*26+30);
  }
}

/* ---------- sterowanie ---------- */
const keys={},mouse={sx:VW/2,sy:VH/2,down:false};
const typing=()=>document.activeElement&&document.activeElement.tagName==='INPUT'&&document.activeElement.type==='text';
function trigPulse(){me.ps=(me.ps+1)|0;audioInit();}
function updAutoBtn(){$('auto').textContent='Auto-cel: '+(me.auto?'TAK':'NIE');}
function toggleAuto(){me.auto=!me.auto;updAutoBtn();toast('Auto-celowanie: '+(me.auto?'włączone':'wyłączone'),1400);}
addEventListener('keydown',e=>{
  if(typing())return;
  keys[e.code]=true;
  if(e.code==='Space'||e.code==='ShiftLeft'){e.preventDefault();if(!e.repeat&&inGame)trigPulse();}
  if(e.code==='KeyM')toggleMute();
  if(e.code==='KeyQ'&&inGame)toggleAuto();
  if(e.code==='Enter'&&inGame&&isHost&&G&&G.ph==='over')newGame(false);
  if(inGame&&['Digit1','Digit2','Digit3'].includes(e.code))doPick(+e.code.slice(5)-1);
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.down=false;});
function setMouse(e){mouse.sx=e.clientX;mouse.sy=e.clientY;}
cv2.addEventListener('mousemove',setMouse);
cv2.addEventListener('mousedown',e=>{setMouse(e);audioInit();
  if(e.button===2){if(inGame)trigPulse();return;}
  if(inGame&&tryPickAt(e.clientX,e.clientY))return;
  mouse.down=true;
  if(inGame&&isHost&&G&&G.ph==='over')newGame(false);});
addEventListener('mouseup',()=>{mouse.down=false;});
cv2.addEventListener('contextmenu',e=>e.preventDefault());

/* dotyk: lewy kciuk = ruch, prawy = ręczne celowanie (opcjonalnie), przycisk = puls */
const tc={mv:null,aim:null,usedTouch:false};
const STICK_R=58;
const pulseBtn=()=>({x:VW-62,y:VH-78,r:34});
function tStart(e){
  e.preventDefault();audioInit();tc.usedTouch=true;
  for(const t of e.changedTouches){
    const p={x:t.clientX,y:t.clientY};
    if(inGame&&tryPickAt(p.x,p.y))continue;
    if(inGame&&isHost&&G&&G.ph==='over'){newGame(false);continue;}
    const b=pulseBtn();
    if(Math.hypot(p.x-b.x,p.y-b.y)<b.r+16){if(inGame)trigPulse();continue;}
    if(p.x<VW*.55){if(!tc.mv)tc.mv={id:t.identifier,ox:p.x,oy:p.y,x:p.x,y:p.y};}
    else if(!tc.aim)tc.aim={id:t.identifier,ox:p.x,oy:p.y,x:p.x,y:p.y};
  }
}
function tMove(e){
  e.preventDefault();
  for(const t of e.changedTouches)for(const s of[tc.mv,tc.aim])if(s&&s.id===t.identifier){s.x=t.clientX;s.y=t.clientY;
    const dx=s.x-s.ox,dy=s.y-s.oy,d=Math.hypot(dx,dy);
    if(d>STICK_R*1.6){const k=(d-STICK_R*1.6)/d;s.ox+=dx*k;s.oy+=dy*k;}}
}
function tEnd(e){for(const t of e.changedTouches){if(tc.mv&&tc.mv.id===t.identifier)tc.mv=null;if(tc.aim&&tc.aim.id===t.identifier)tc.aim=null;}}
cv2.addEventListener('touchstart',tStart,{passive:false});
cv2.addEventListener('touchmove',tMove,{passive:false});
cv2.addEventListener('touchend',tEnd);
cv2.addEventListener('touchcancel',tEnd);
function stickVec(s){if(!s)return null;const dx=s.x-s.ox,dy=s.y-s.oy,d=Math.hypot(dx,dy);return{dx,dy,d,m:Math.min(1,d/STICK_R)};}

let lastShootSfx=0;
function nearestEnemy(R,maxD){let b=null,bd=maxD;for(const e of R.enemies){const d=Math.hypot(e.x-me.x,e.y-me.y)-e.r*.3;if(d<bd){bd=d;b=e;}}return b;}
function localUpdate(dt){
  const R=view(),mp=meP(),down=mp&&mp.down,dead=R.ph==='over';
  const spdM=mp?(mp.spd||100)/100:1;
  let dx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  let dy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  const l=Math.hypot(dx,dy);if(l){dx/=l;dy/=l;}
  let mag=1;
  const sm=stickVec(tc.mv);
  if(sm&&sm.d>6){dx=sm.dx/sm.d;dy=sm.dy/sm.d;mag=Math.max(.4,sm.m);}
  const sp=(down||dead)?0:255*spdM*mag,k=Math.min(1,dt*9);
  me.vx+=(dx*sp-me.vx)*k;me.vy+=(dy*sp-me.vy)*k;
  me.x=clamp(me.x+me.vx*dt,22,W-22);me.y=clamp(me.y+me.vy*dt,22,H-22);
  // celowanie
  const sa=stickVec(tc.aim);let manual=false;
  if(sa&&sa.d>12){me.a=Math.atan2(sa.dy,sa.dx);me.f=true;manual=true;}
  if(!manual){
    const moving=Math.hypot(me.vx,me.vy)>40;
    if(me.auto){
      const t=nearestEnemy(R,720);
      if(t){me.a=Math.atan2(t.y-me.y,t.x-me.x);me.f=true;}
      else{me.f=false;if(moving)me.a=Math.atan2(me.vy,me.vx);}
    }else if(IS_TOUCH&&tc.usedTouch){me.f=false;if(moving)me.a=Math.atan2(me.vy,me.vx);}
    else{const w=s2w(mouse.sx,mouse.sy);me.a=Math.atan2(w.y-me.y,w.x-me.x);me.f=mouse.down;}
  }
  if(down||dead)me.f=false;
  if(me.f&&performance.now()-lastShootSfx>260){lastShootSfx=performance.now();sfx('shoot');}
}

/* ---------- pętla symulacji / sieci ---------- */
let lastT=performance.now(),netAcc=0,inAcc=0;
setInterval(()=>{
  const now=performance.now();let dt=Math.min(.1,(now-lastT)/1000);lastT=now;
  if(isHost&&G&&net){
    hostStep(dt);
    if(G.ev.length>(G.evSeen|0)){processEvents(G.ev.slice(G.evSeen|0));G.evSeen=G.ev.length;}
    netAcc+=dt;if(netAcc>=.1){netAcc=0;broadcast();G.ev=[];G.evSeen=0;}
    else if(G.pl.length<2){G.ev=[];G.evSeen=0;}
  }else if(!isHost&&net&&joined){
    inAcc+=dt;if(inAcc>=.1){inAcc=0;net.send({t:'in',id:me.id,x:Math.round(me.x),y:Math.round(me.y),a:+me.a.toFixed(2),f:me.f?1:0,ps:me.ps});}
  }
},16);

/* ---------- UI ---------- */
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:.55;$('mute').textContent=muted?'Dźwięk: wył.':'Dźwięk';}
$('create').onclick=startHost;
$('join').onclick=startJoin;
$('leave').onclick=()=>leave();
$('mute').onclick=toggleMute;
$('auto').onclick=toggleAuto;
$('fs').onclick=async()=>{
  try{if(document.fullscreenElement)await document.exitFullscreen();else{await document.documentElement.requestFullscreen();
    if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}}
  catch(e){toast('Pełny ekran niedostępny w tej przeglądarce (na iPhone dodaj stronę do ekranu głównego)',4000);}
};
$('copy').onclick=async()=>{
  const url=location.origin+location.pathname+'?room='+roomCode+(MODE==='local'?'&local=1':'');
  try{await navigator.clipboard.writeText(url);toast('Link skopiowany: '+url);}catch(e){toast(url,5000);}
};
$('code').addEventListener('keydown',e=>{if(e.key==='Enter')startJoin();});
$('code').addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z]/g,'');});
(function init(){
  const q=new URLSearchParams(location.search);
  try{$('name').value=localStorage.getItem('gloworm_name')||'';}catch(e){}
  if(q.get('local'))$('local').checked=true;
  if(q.get('room'))$('code').value=q.get('room').toUpperCase().slice(0,4);
})();
requestAnimationFrame(frame);
</script>
